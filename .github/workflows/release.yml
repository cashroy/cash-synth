# Builds the installers and publishes a GitHub Release when a version tag (v1.2.3) is pushed.
#   macOS:   universal (Apple silicon + Intel) VST3 / AU / Standalone -> CashSynth-mac.pkg
#   Windows: x64 VST3 / Standalone -> CashSynth-Setup.exe (Inno Setup)
# Pushing a release-* branch (or running it by hand) builds the installers as artifacts without releasing.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=$(sed -n 's/^project(CashSynth VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"
      - name: Configure (universal Release)
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCASH_BUILD_TESTS=OFF -DCASH_COPY_PLUGINS=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build -j4 --target CashSynth_VST3 CashSynth_AU CashSynth_Standalone
      - name: Check both architectures
        run: lipo -info "build/CashSynth_artefacts/Release/VST3/Cash Synth.vst3/Contents/MacOS/Cash Synth"
      - name: Package
        run: packaging/mac/build_pkg.sh build/CashSynth_artefacts/Release "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.pkg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: echo "VERSION=$(sed -n 's/^project(CashSynth VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCASH_COPY_PLUGINS=OFF
      - name: Build plug-ins and tests
        run: cmake --build build --config Release --parallel --target CashSynth_VST3 CashSynth_Standalone CashSynthTests
      - name: Tests
        # The big-model save/load timing check is machine-speed dependent; everything else must pass.
        run: ctest --test-dir build -C Release -j4 --output-on-failure -E "big Mint model"
      - name: Package
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=$env:VERSION "/DArtefacts=$env:GITHUB_WORKSPACE\build\CashSynth_artefacts\Release" "/DOutDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\CashSynth.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "Cash Synth ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md --verify-tag
